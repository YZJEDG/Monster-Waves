modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
怪物狂潮（Monster Waves）—— 源源不断地刷新怪物，击杀掉落属性球，永久强化玩家属性。
当前为 MVP 阶段：生成引擎 + 属性球 + 玩家属性存储 + 阶段系统 + 基础指令。
'''

