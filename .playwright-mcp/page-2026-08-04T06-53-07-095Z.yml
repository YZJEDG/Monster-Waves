          - row [ref=f2e719]:
            - cell [ref=f2e720]:
              - code [ref=f2e721]: MobAttributeCalculateEvent
            - cell [ref=f2e722]:
              - text: 怪物生命/攻击/护甲计算钩子：
              - code [ref=f2e723]: setCustomValue()
              - text: +
              - code [ref=f2e724]: setCanceled(true)
              - text: 完全接管算法。注意：
              - code [ref=f2e725]: Event.getResult()
              - text: 是 final 方法，事件方法名为
              - code [ref=f2e726]: setCustomValue/getCustomValue
      - code [ref=f2e728]: "// 示例：监听怪物属性计算（任何 mod 均可） @SubscribeEvent public static void onCalc(MobAttributeCalculateEvent e) { e.setCustomValue(e.getBaseValue() * (1 + e.getDifficulty() * 0.5)); // 自定义公式 e.setCanceled(true); }"
